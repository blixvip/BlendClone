[project]
name = "blendclone"
version = "0.1.0"
description = "Turn a reference video into an editable Blender project."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "pydantic==2.13.5",
    "uvicorn==0.41.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "opencv-python-headless==4.13.0.92",
    "Pillow==12.3.0",
    "numpy==2.4.3",
    "yt-dlp==2026.8.19",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "playwright==1.58.0"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
